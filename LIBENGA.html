<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#2a0610">
<title>LIBENGA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#2a0610;--cream:#f6ead2;--mut:#cdb98f;--gold:#d4af37;--gg:linear-gradient(135deg,#f3dc8a,#c9a24a 55%,#8d6a1f);--card:rgba(90,14,34,.55);--red:#e8654f;
color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;color:var(--cream);font:400 16px/1.5 "DM Sans",system-ui,sans-serif;background-color:var(--bg);background-image:radial-gradient(120% 70% at 50% 0%,#5e0f27 0%,#3a0a16 50%,#1d0409 100%),repeating-linear-gradient(45deg,rgba(255,255,255,.025) 0 2px,transparent 2px 5px);background-attachment:fixed}
main{max-width:560px;margin:0 auto;padding:18px 16px 120px}
h1{font:700 1.9rem/1.15 "Playfair Display",Georgia,serif;margin:6px 0 12px;background:var(--gg);-webkit-background-clip:text;background-clip:text;color:transparent}
.mut{color:var(--mut);font-size:.9rem}
.card{background:var(--card);border:1px solid var(--gold);border-radius:16px;padding:16px;margin:14px 0;box-shadow:inset 0 0 0 3px #2a0610,inset 0 0 0 4px rgba(212,175,55,.45)}
.lb{display:block;color:var(--mut);font-size:.85rem}
.big{font:700 2.1rem/1.15 "Playfair Display",Georgia,serif;color:#f3dc8a}
.big.neg{color:var(--red)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.two b{display:block;font-size:1.05rem}
.mn{display:flex;align-items:center;gap:8px;margin:4px 0 8px}
.mn b{flex:1;text-align:center;text-transform:capitalize;font:600 1.15rem "Playfair Display",serif}
.mn button{width:42px;height:42px;border-radius:50%;border:1px solid var(--gold);background:transparent;color:var(--gold);font-size:1.3rem;cursor:pointer}
label{display:block;font-weight:700;font-size:.88rem;margin:12px 0 4px;color:var(--mut)}
input,select,textarea{width:100%;border:1px solid var(--gold);border-radius:10px;padding:12px;font:500 1rem "DM Sans",sans-serif;background:rgba(20,2,8,.6);color:var(--cream)}
select option{background:#2a0610}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:14px;margin-top:16px;font:700 1.05rem "DM Sans",sans-serif;background:var(--gg);color:#2a0610;cursor:pointer;box-shadow:0 0 0 rgba(243,220,138,0);transition:box-shadow .2s}
.btn:active{box-shadow:0 0 18px rgba(243,220,138,.7)}
.btn.o{background:transparent;color:var(--gold);border:1px solid var(--gold);margin-top:10px}
.link{background:none;border:0;color:var(--gold);font:700 .92rem "DM Sans",sans-serif;text-decoration:underline;padding:12px 0;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #f3dc8a;outline-offset:2px}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--gold);border-radius:12px;overflow:hidden}
.seg button{padding:11px;border:0;background:transparent;color:var(--cream);font:700 1rem "DM Sans",sans-serif;cursor:pointer}
.seg button.on{background:var(--gg);color:#2a0610}
.bar{height:10px;border:1px solid var(--gold);border-radius:99px;overflow:hidden;margin:6px 0 2px;background:rgba(0,0,0,.3)}
.bar i{display:block;height:100%;background:var(--gg)}
.bar.warn i{background:#f0b429}.bar.over i{background:var(--red)}
.crow{display:grid;grid-template-columns:132px 1fr;gap:10px;align-items:center;margin:8px 0;font-size:.9rem}
.it{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid rgba(212,175,55,.25)}
.it:last-child{border:0}
.it .e{font-size:1.4rem}.it .x{flex:1;min-width:0}.it .x b{display:block}.it .x span{color:var(--mut);font-size:.85rem;overflow-wrap:anywhere}
.it .a{font-weight:700;text-align:right;white-space:nowrap}.it .a.r{color:#f3dc8a}
.ib{width:36px;height:36px;border:1px solid var(--gold);background:transparent;color:var(--gold);border-radius:10px;cursor:pointer;font-size:1rem}
.bl{margin:12px 0}.bh{display:flex;justify-content:space-between;align-items:center;gap:10px}.bi{width:120px;text-align:right}
.tip{border:1px dashed var(--gold);border-radius:12px;padding:12px;color:#f3dc8a;margin:10px 0;cursor:pointer}
.err{color:var(--red);font-weight:700;min-height:1.2em;margin-top:8px}
.toast{position:fixed;left:14px;right:14px;bottom:calc(86px + env(safe-area-inset-bottom,0px));background:#f3dc8a;color:#2a0610;font-weight:700;padding:14px;border-radius:12px;white-space:pre-line;z-index:20;display:none;box-shadow:0 6px 24px rgba(0,0,0,.5)}
.toast.on{display:block}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-around;background:#1d0409;border-top:1px solid var(--gold);padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px));z-index:10}
.nav button{flex:1;background:none;border:0;color:var(--mut);font:700 .78rem "DM Sans",sans-serif;padding:6px 2px;cursor:pointer}
.nav button span{display:block;font-size:1.3rem}.nav button.on{color:#f3dc8a}
.rl{background:linear-gradient(160deg,#5e0f27,#2a0610);border:2px solid #d4af37;border-radius:14px;padding:18px;margin:14px 0}.rl .rt{font:700 1.45rem "Playfair Display",Georgia,serif;color:#f3dc8a;text-transform:capitalize}.rl .rs{color:#cdb98f;font-size:.85rem;margin-bottom:12px}.rl h3{font:700 1rem "Playfair Display",Georgia,serif;color:#f3dc8a;margin:16px 0 4px}.rr{display:grid;grid-template-columns:1fr auto auto;gap:10px;font-size:.84rem;padding:5px 0;border-bottom:1px solid rgba(212,175,55,.2)}.rr.h{color:#cdb98f;font-weight:700}.rr span:nth-child(n+2){text-align:right}.rl .rf{margin-top:16px;text-align:center;color:#cdb98f;font-size:.8rem}details a{color:#f3dc8a}
details{border-bottom:1px solid rgba(212,175,55,.25);padding:11px 0}details:last-child{border:0}summary{cursor:pointer;font-weight:700;color:#f3dc8a}details p{margin:8px 0 0}
footer{text-align:center;color:var(--mut);font-weight:700;font-size:.88rem;margin-top:26px}
footer a{color:var(--mut);font-weight:400}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
<main><div id="app"></div><footer>Réalisé par HÉRITIER KISENGE<br><a href="https://www.exchangerate-api.com" target="_blank" rel="noopener">Taux de change : ExchangeRate-API</a></footer></main>
<div class="toast" id="toast" role="alert"></div>
<nav class="nav"><button data-t="home" onclick="go('home')"><span>🏛️</span>Accueil</button><button data-t="add" onclick="D.ed=null;go('add')"><span>➕</span>Ajouter</button><button data-t="bud" onclick="go('bud')"><span>🎯</span>Budget</button><button data-t="set" onclick="go('set')"><span>⚙️</span>Réglages</button></nav>
<script>
var CT=[["Alimentation","🛒"],["Transport","🚌"],["Logement","🏠"],["Loisirs","🎮"],["Santé","💊"],["Études","📚"],["Abonnement","🔁"],["Don","🎁"],["Urgence familiale","🆘"],["Petit plaisir","🍬"],["Autres","📦"],["Salaire","💼"],["Aide reçue","🤝"],["Vente","🏷️"],["Autre revenu","➕"]],NE=11,K="depenses-or-v1";
var D={tx:[],bud:{},disp:"USD",rate:{r:2800,t:0,src:"défaut"},ed:null},tb="home",ty="d";
var $=function(i){return document.getElementById(i)};
function ld(){try{var o=JSON.parse(localStorage.getItem(K));if(o&&o.tx)D=Object.assign(D,o)}catch(e){}D.ed=null}
function sv(){try{localStorage.setItem(K,JSON.stringify(D))}catch(e){}}
function ymd(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
var realm=ymd(new Date()).slice(0,7),cm=realm;
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function num(s){return parseFloat(String(s).replace(/\s/g,"").replace(",","."))}
function usd(a,c){return c==="USD"?a:a/D.rate.r}
function sh(u){return D.disp==="USD"?u:u*D.rate.r}
function toU(v){return D.disp==="USD"?v:v/D.rate.r}
function fm(u){var v=sh(u);return D.disp==="USD"?v.toLocaleString("fr-FR",{minimumFractionDigits:2,maximumFractionDigits:2})+" $":Math.round(v).toLocaleString("fr-FR")+" FC"}
function rv_(v){return String(Math.round(v*100)/100).replace(".",",")}
function getRate(){
 if(D.rate.src==="manuel"||Date.now()-D.rate.t<864e5)return;
 try{fetch("https://open.er-api.com/v6/latest/USD").then(function(r){return r.json()}).then(function(j){if(j&&j.rates&&j.rates.CDF){D.rate={r:j.rates.CDF,t:Date.now(),src:"en ligne"};sv();view()}}).catch(function(){})}catch(e){}
}
function go(t){tb=t;view();window.scrollTo(0,0)}
function mv(n){var p=cm.split("-");cm=ymd(new Date(+p[0],+p[1]-1+n,1)).slice(0,7);view()}
function mnav(){var p=cm.split("-"),l=new Date(+p[0],+p[1]-1,1).toLocaleDateString("fr-FR",{month:"long",year:"numeric"});return'<div class="mn"><button onclick="mv(-1)" aria-label="Mois précédent">‹</button><b>'+l+'</b><button onclick="mv(1)" aria-label="Mois suivant">›</button></div>'}
function stat(m){var s={},t=0;D.tx.forEach(function(x){if(x.t=="d"&&x.d.slice(0,7)==m){var u=usd(x.a,x.cu);s[x.c]=(s[x.c]||0)+u;t+=u}});var b=D.bud[m]||{c:{},s:0},bt=0;for(var k in b.c)bt+=b.c[k];return{sp:s,t:t,b:b.c,bt:bt,sv:b.s||0}}
function view(){
 $("app").innerHTML=tb=="home"?home():tb=="add"?addv():tb=="bud"?budv():tb=="rel"?relv():setv();
 if(tb=="add")initAdd();
 document.querySelectorAll(".nav button").forEach(function(b){b.classList.toggle("on",b.dataset.t==tb)});
}
function home(){
 var it=D.tx.filter(function(x){return x.d.slice(0,7)==cm}).sort(function(a,b){return a.d<b.d?1:a.d>b.d?-1:b.id-a.id}),st=stat(cm),rv=0;
 it.forEach(function(x){if(x.t=="r")rv+=usd(x.a,x.cu)});
 var sol=rv-st.t,h="<h1>LIBENGA</h1>"+mnav();
 if(!D.bud[realm])h+='<div class="tip" onclick="go(\'bud\')">Tu n’as pas encore fait ton budget de ce mois. Appuie ici pour le préparer.</div>';
 h+='<div class="card"><span class="lb">Solde du mois</span><div class="big'+(sol<0?" neg":"")+'">'+fm(sol)+'</div><div class="two"><div><span class="lb">Revenus</span><b>'+fm(rv)+'</b></div><div><span class="lb">Dépenses</span><b>'+fm(st.t)+'</b></div></div>';
 if(st.bt>0){var r=st.t/st.bt;h+='<div class="bar'+(r>=1?" over":r>=.8?" warn":"")+'"><i style="width:'+Math.min(100,r*100)+'%"></i></div><div class="mut">'+(r>=1?"Budget dépassé de "+fm(st.t-st.bt):"Il reste "+fm(st.bt-st.t)+" sur "+fm(st.bt))+'</div>'}
 h+='</div><h1 style="font-size:1.4rem">Répartition</h1><div class="card">';
 var ks=Object.keys(st.sp).sort(function(a,b){return st.sp[b]-st.sp[a]});
 h+=ks.length?ks.map(function(k){return'<div class="crow"><span>'+CT[k][1]+" "+CT[k][0]+'<span class="lb">'+fm(st.sp[k])+" · "+Math.round(st.sp[k]/st.t*100)+' %</span></span><div class="bar"><i style="width:'+st.sp[k]/st.sp[ks[0]]*100+'%"></i></div></div>'}).join(""):'<p class="mut">Aucune dépense ce mois-ci.</p>';
 h+='</div><h1 style="font-size:1.4rem">Opérations</h1><div class="card">';
 h+=it.length?it.map(function(x){var d=x.d.split("-"),u=usd(x.a,x.cu);return'<div class="it"><span class="e">'+CT[x.c][1]+'</span><div class="x"><b>'+CT[x.c][0]+'</b><span>'+d[2]+"/"+d[1]+(x.n?" · "+esc(x.n):"")+(x.cu!=(D.disp=="USD"?"USD":"CDF")?" · saisi : "+rv_(x.a)+(x.cu=="USD"?" $":" FC"):"")+'</span></div><span class="a'+(x.t=="r"?" r":"")+'">'+(x.t=="r"?"+":"−")+fm(u)+'</span><button class="ib" onclick="ed('+x.id+')" aria-label="Modifier">✎</button><button class="ib" onclick="del('+x.id+')" aria-label="Supprimer">×</button></div>'}).join(""):'<p class="mut">Rien pour ce mois. Appuie sur Ajouter.</p>';
 return h+"</div>";
}
function ed(id){D.ed=id;go("add")}
function del(id){D.tx=D.tx.filter(function(x){return x.id!==id});sv();view()}
function addv(){var e=D.ed&&D.tx.find(function(x){return x.id==D.ed});
 return'<h1>'+(e?"Modifier":"Ajouter")+'</h1><div class="card"><div class="seg"><button id="td" onclick="st_(\'d\')">Dépense</button><button id="tr" onclick="st_(\'r\')">Revenu</button></div><div class="two"><div><label for="am">Montant</label><input id="am" inputmode="decimal" oninput="eq()" placeholder="0" autocomplete="off"></div><div><label for="cu">Devise</label><select id="cu" onchange="eq()"><option value="USD">$ (USD)</option><option value="CDF">FC (CDF)</option></select></div></div><div class="mut" id="eq" style="margin-top:6px"></div><label for="ct">Catégorie</label><select id="ct"></select><label for="nt">Note (facultatif)</label><input id="nt" maxlength="60"><label for="dt">Date</label><input id="dt" type="date"><div class="err" id="err" role="alert"></div><button class="btn" onclick="save()">'+(e?"Enregistrer":"Ajouter")+'</button>'+(e?'<button class="btn o" onclick="D.ed=null;go(\'home\')">Annuler</button>':"")+'</div>'}
function initAdd(){var e=D.ed&&D.tx.find(function(x){return x.id==D.ed});ty=e?e.t:"d";st_(ty);
 if(e){$("am").value=rv_(e.a);$("cu").value=e.cu;$("ct").value=e.c;$("nt").value=e.n;$("dt").value=e.d}else{$("cu").value=D.disp;$("dt").value=ymd(new Date())}eq()}
function st_(t){ty=t;var cur=$("ct").value;$("ct").innerHTML=CT.map(function(c,i){return(t=="d"?i<NE:i>=NE)?'<option value="'+i+'">'+c[1]+" "+c[0]+"</option>":""}).join("");if(cur&&$("ct").querySelector('[value="'+cur+'"]'))$("ct").value=cur;$("td").className=t=="d"?"on":"";$("tr").className=t=="r"?"on":""}
function eq(){var a=num($("am").value);$("eq").textContent=a>0?($("cu").value=="USD"?"≈ "+Math.round(a*D.rate.r).toLocaleString("fr-FR")+" FC":"≈ "+(a/D.rate.r).toLocaleString("fr-FR",{minimumFractionDigits:2,maximumFractionDigits:2})+" $"):"L’équivalent dans l’autre devise s’affiche ici."}
function save(){
 var a=num($("am").value),d=$("dt").value;
 if(!(a>0)){$("err").textContent="Entre un montant supérieur à 0.";return}
 if(!d){$("err").textContent="Choisis une date.";return}
 var m=d.slice(0,7),b=stat(m),o={id:D.ed||Date.now(),t:ty,a:Math.round(a*100)/100,cu:$("cu").value,c:+$("ct").value,n:$("nt").value.trim(),d:d};
 if(D.ed)D.tx=D.tx.map(function(x){return x.id==D.ed?o:x});else D.tx.push(o);
 D.ed=null;sv();cm=m;go("home");
 if(ty=="d")chk(b,stat(m));
}
function lv(r){return r>=1?2:r>=.8?1:0}
function chk(b,a){var ms=[];
 for(var k in a.b){if(a.b[k]>0&&lv((a.sp[k]||0)/a.b[k])>lv((b.sp[k]||0)/a.b[k]))ms.push(CT[k][1]+" "+CT[k][0]+" : "+((a.sp[k]||0)>=a.b[k]?"budget dépassé":"80 % du budget atteint"))}
 if(a.bt>0&&lv(a.t/a.bt)>lv(b.t/a.bt))ms.push("Budget total : "+(a.t>=a.bt?"dépassé":"80 % atteint"));
 if(ms.length)warn(ms.join("\n"));
}
function warn(t){var e=$("toast");e.textContent=t;e.className="toast on";clearTimeout(window.tt);window.tt=setTimeout(function(){e.className="toast"},7000);
 try{navigator.vibrate&&navigator.vibrate([250,120,250])}catch(x){}
 try{if(window.Notification&&Notification.permission=="granted")new Notification("Alerte budget",{body:t})}catch(x){}}
function budv(){var st=stat(cm),rv=0;D.tx.forEach(function(x){if(x.t=="r"&&x.d.slice(0,7)==cm)rv+=usd(x.a,x.cu)});
 var h="<h1>Budget</h1>"+mnav()+'<p class="mut">Fixe tes prévisions en début de mois, en '+(D.disp=="USD"?"dollars ($)":"francs congolais (FC)")+'. Une alerte te prévient à 80 % et à 100 %.</p><div class="card">';
 for(var i=0;i<NE;i++){var b=st.b[i]||0,s=st.sp[i]||0,r=b>0?s/b:0;
  h+='<div class="bl"><div class="bh"><span>'+CT[i][1]+" "+CT[i][0]+'</span><input class="bi" inputmode="decimal" placeholder="0" value="'+(b>0?rv_(sh(b)):"")+'" onchange="sb('+i+',this.value)" aria-label="Prévision '+CT[i][0]+'"></div>'+(b>0?'<div class="bar'+(r>=1?" over":r>=.8?" warn":"")+'"><i style="width:'+Math.min(100,r*100)+'%"></i></div><div class="mut">'+fm(s)+" dépensés sur "+fm(b)+"</div>":(s>0?'<div class="mut">'+fm(s)+" dépensés</div>":""))+"</div>"}
 var tot=st.bt+st.sv;
 h+='<div class="bl"><div class="bh"><span>💎 Épargne prévue</span><input class="bi" inputmode="decimal" placeholder="0" value="'+(st.sv>0?rv_(sh(st.sv)):"")+'" onchange="ss(this.value)" aria-label="Épargne prévue"></div></div></div>';
 h+='<div class="card"><div class="two"><div><span class="lb">Dépenses prévues</span><b>'+fm(st.bt)+'</b></div><div><span class="lb">Épargne prévue</span><b>'+fm(st.sv)+'</b></div></div><div class="two"><div><span class="lb">Revenus du mois</span><b>'+fm(rv)+'</b></div><div><span class="lb">Reste à répartir</span><b'+(rv-tot<0?' style="color:var(--red)"':"")+'>'+fm(rv-tot)+'</b></div></div></div>';
 return h}
function sb(i,v){v=num(v);D.bud[cm]=D.bud[cm]||{c:{},s:0};if(v>0)D.bud[cm].c[i]=toU(v);else delete D.bud[cm].c[i];sv();view()}
function ss(v){v=num(v);D.bud[cm]=D.bud[cm]||{c:{},s:0};D.bud[cm].s=v>0?toU(v):0;sv();view()}
function setv(){var n=window.Notification?Notification.permission:"non";
 return'<h1>Réglages</h1><div class="card"><span class="lb">Devise affichée</span><div class="seg" style="margin-top:6px"><button class="'+(D.disp=="USD"?"on":"")+'" onclick="sd(\'USD\')">Dollar ($)</button><button class="'+(D.disp=="CDF"?"on":"")+'" onclick="sd(\'CDF\')">Franc congolais (FC)</button></div>'+
 '<p class="mut" style="margin-top:12px">1 $ = '+Math.round(D.rate.r*100)/100+' FC · '+D.rate.src+(D.rate.t?" · "+new Date(D.rate.t).toLocaleDateString("fr-FR"):"")+'</p><label for="rt">Taux personnalisé (1 $ = ? FC)</label><input id="rt" inputmode="decimal" placeholder="Ex. : 2800"><button class="btn o" onclick="sr()">Utiliser ce taux</button><button class="link" onclick="ar()">Reprendre le taux en ligne</button></div>'+
 '<div class="card"><span class="lb">Alertes</span><p class="mut">Le téléphone vibre (Android) et une alerte s’affiche quand un budget approche ou dépasse la limite. Les notifications fonctionnent quand l’application est ouverte.</p><button class="btn o" onclick="an()">'+(n=="granted"?"Notifications activées ✓":"Activer les notifications")+'</button></div>'+
 '<div class="card"><span class="lb">Sauvegarde</span><p class="mut">Tes données restent sur ce téléphone. L’application est encore en développement : sauvegarde le plus souvent possible, surtout avant une mise à jour.</p><button class="btn o" onclick="cb()">Copier la sauvegarde</button><button class="btn o" onclick="db()">Télécharger un fichier</button><label for="rb">Restaurer (remplace les données actuelles)</label><textarea id="rb" rows="3" placeholder="Colle ici ta sauvegarde"></textarea><button class="btn o" onclick="rb()">Restaurer</button><div class="mut" id="sm" style="margin-top:8px" role="status"></div></div><div class="card"><span class="lb">Relevé</span><p class="mut">Un résumé de ton mois (revenus, dépenses, budget, opérations) à télécharger en image ou en PDF.</p><button class="btn" onclick="go(\'rel\')">Voir mon relevé (PNG ou PDF)</button></div>'+faq()}
function faq(){var q=[

var APP="LIBENGA";

function relv(){
var st=stat(cm),rv=0,it=D.tx.filter(function(x){return x.d.slice(0,7)==cm}).sort(function(a,b){return a.d<b.d?-1:a.d>b.d?1:a.id-b.id});

var h='<button class="link" onclick="go(\'set\')">‹ Retour aux réglages</button><h1>Relevé</h1>'+mnav()+'<p class="mut">Devise du relevé : '+(D.disp=="USD"?"dollar ($)":"franc congolais (FC)")+'. Tu peux la changer dans Réglages.</p><div id="rl" class="rl"><div class="rt">Relevé de '+lab+'</div><div class="rs">'+APP+'</div>'+rr("Revenus","",fm(rv))+rr("Dépenses","",fm(st.t))+rr("Solde","",fm(rv-st.t))+rr("Épargne prévue","",fm(st.sv));
h+='<h3>Budget par catégorie</h3>'+rr("Catégorie","Prévu","Réel",1);
for(var i=0;i<NE;i++){if(st.b[i]>0||st.sp[i]>0)h+=rr(CT[i][1]+" "+CT[i][0],st.b[i]>0?fm(st.b[i]):"—",fm(st.sp[i]||0))}
h+='<h3>Opérations</h3>';
h+=it.length?it.slice(0,40).map(function(x){var d=x.d.split("-");return rr(d[2]+"/"+d[1]+" "+CT[x.c][1]+" "+CT[x.c][0]+(x.n?" · "+esc(x.n):""),"",(x.t=="r"?"+":"−")+fm(usd(x.a,x.cu)))}).join("")+(it.length>40?'<div class="rs">… et '+(it.length-40)+' autres opérations</div>':""):'<div class="rs">Aucune opération ce mois-ci.</div>';
h+='<div class="rf">Réalisé par HÉRITIER KISENGE · Généré le '+new Date().toLocaleDateString("fr-FR")+'</div></div>';
return h+'<button class="btn" onclick="dl(\'png\')">Télécharger en PNG</button><button class="btn o" onclick="dl(\'pdf\')">Télécharger en PDF</button><div class="mut" id="rm" role="status" style="margin-top:8px"></div>'}
function dl(f){var el=$("rl"),m=$("rm");
if(!window.html2canvas){m.textContent="Outil indisponible : vérifie ta connexion Internet.";return}
m.textContent="Création du relevé…";
html2canvas(el,{scale:2,backgroundColor:"#2a0610"}).then(function(cv){var n="releve-"+cm;
if(f=="png"){var a=document.createElement("a");a.href=cv.toDataURL("image/png");a.download=n+".png";a.click();m.textContent="Image envoyée vers tes téléchargements."}
else{var pd=new window.jspdf.jsPDF("p","mm","a4"),w=210,ph=297,ih=cv.height*w/cv.width,img=cv.toDataURL("image/jpeg",.92),y=0,left=ih;
while(true){pd.setFillColor(42,6,16);pd.rect(0,0,w,ph,"F");pd.addImage(img,"JPEG",0,y,w,ih);left-=ph;if(left<=0)break;y-=ph;pd.addPage()}
pd.save(n+".pdf");m.textContent="PDF envoyé vers tes téléchargements."}
}).catch(function(){m.textContent="Création impossible sur ce navigateur."})}
